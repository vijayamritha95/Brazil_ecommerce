<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Brazilian {% endblock %} | E-Commerce Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-shopping-bag"></i>
                <span>E-Commerce Analytics </span>
            </div>
            <nav class="nav-menu">
                <div class="nav-section">
                    <div class="nav-section-title">Main Menu</div>
                    <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
                        <i class="fas fa-th-large"></i><span>Dashboard</span>
                    </a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">SQL Analysis</div>
                    <a href="{{ url_for('order_freight') }}" class="nav-item {% if request.endpoint == 'order_freight' %}active{% endif %}">
                        <i class="fas fa-truck"></i><span>Order & Freight</span>
                    </a>
                    <a href="{{ url_for('category_sales') }}" class="nav-item {% if request.endpoint == 'category_sales' %}active{% endif %}">
                        <i class="fas fa-layer-group"></i><span>Category Sales</span>
                    </a>
                    <a href="{{ url_for('seller_performance') }}" class="nav-item {% if request.endpoint == 'seller_performance' %}active{% endif %}">
                        <i class="fas fa-trophy"></i><span>Seller Ranking</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-left">
                    <h1 class="page-title">{% block page_title %}{% endblock %}</h1>
                    <p class="page-subtitle">{% block page_subtitle %}{% endblock %}</p>
                </div>
                <div class="top-bar-right">
                    <div class="refresh-badge">
                        <i class="fas fa-sync-alt"></i>
                        <span>Live Database Data</span>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
